; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32
name = ESPLEDController
description = ESP LED Controller

[env]
framework = arduino
monitor_speed = 115200
upload_speed = 921600
extra_scripts = 
	pre:buildscript_versioning.py
lib_compat_mode = strict
lib_ldf_mode = chain
lib_deps = 
	ESP32Async/AsyncTCP@^3.5.0
	ESP32Async/ESPAsyncWebServer@^3.12.1
	jsc/ArduinoLog@^1.2.1
	bblanchon/ArduinoJson@^7.4.3
	bblanchon/StreamUtils@^1.9.2
	ayushsharma82/ElegantOTA@^4.0.0
	fastled/FastLED@^3.10.6
	adafruit/Adafruit SSD1306@^2.5.17
	adafruit/Adafruit GFX Library@^1.12.6
	knolleary/PubSubClient@^2.8
build_flags = 
	-D CORE_DEBUG_LEVEL=4
	-D ELEGANTOTA_USE_ASYNC_WEBSERVER=1


[env:esp8266]
platform = espressif8266
board = esp12e
board_build.f_cpu = 160000000L
build_flags =
  ${env.build_flags}
  -D FASTLED_INTERRUPT_RETRY_COUNT=1
lib_deps =
  ${env.lib_deps}

[env:esp32]
platform = espressif32
board = esp32doit-devkit-v1
; Default 4MB layout caps the app at 1.25MB; min_spiffs gives 1.9MB per OTA slot (no filesystem is used)
board_build.partitions = min_spiffs.csv
lib_deps =
  ${env.lib_deps}

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
; Same 1.25MB app-slot limit as esp32; min_spiffs keeps two 1.9MB OTA slots
board_build.partitions = min_spiffs.csv
monitor_speed = 460800
monitor_rts = 0
monitor_dtr = 0
build_flags = ${env.build_flags}
	-D ARDUINO_LOLIN_C3_MINI
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D LOG_LEVEL=LOG_LEVEL_SILENT
lib_deps = 
	${env.lib_deps}

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_build.psram_type = qio
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = min_spiffs.csv
monitor_speed = 460800
monitor_rts = 0
monitor_dtr = 0
lib_compat_mode = strict
build_flags = ${env.build_flags}
	-D ARDUINO_LOLIN_C3_MINI
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D BOARD_HAS_PSRAM
	-D LOG_LEVEL=LOG_LEVEL_SILENT
lib_deps = 
	${env.lib_deps}

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
lib_compat_mode = strict
build_flags = ${env.build_flags}
lib_deps = 
	${env.lib_deps}
